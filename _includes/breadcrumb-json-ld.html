{% if page.breadcrumb_name %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "ホーム",
      "item": {{ '/' | absolute_url | jsonify }}
    }{% if page.breadcrumb_parent_path %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.breadcrumb_parent_name | jsonify }},
      "item": {{ page.breadcrumb_parent_path | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.breadcrumb_name | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.breadcrumb_name | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }{% endif %}
  ]
}
</script>
{% endif %}
