{% comment %}
  組合員入力欄（最大5名）。位置は css/style.css の .soshiki-form-member-* で調整。
  HTML id/name は Access 列名の kebab-case（§9.9）。異動内容 idou のみ Web 専用。
  DEV: 1行目のみ placeholder（配置確認用）。異動・性別の .soshiki-form-dev-marker は全5行。本番前に削除する。
{% endcomment %}
<div class="soshiki-form-member-rows" aria-label="組合員入力（最大5名）">
  {% for row in (1..5) %}
  <div
    class="soshiki-form-member-row"
    data-row="{{ row }}"
    style="--member-row-index: {{ row | minus: 1 }};"
  >
    <div class="soshiki-form-idou-group" role="group" aria-label="{{ row }}行目・異動内容">
      <input type="hidden" id="member-{{ row }}-idou" name="member-{{ row }}-idou" value="">
      <button
        type="button"
        class="soshiki-form-idou-btn soshiki-form-idou-btn--shinki"
        data-idou="shinki"
        data-row="{{ row }}"
        aria-pressed="false"
        aria-label="{{ row }}行目・新規"
      ><span class="soshiki-form-dev-marker" aria-hidden="true">新 規</span><span class="sr-only">新規</span></button>
      <button
        type="button"
        class="soshiki-form-idou-btn soshiki-form-idou-btn--kaiyaku"
        data-idou="kaiyaku"
        data-row="{{ row }}"
        aria-pressed="false"
        aria-label="{{ row }}行目・解約"
      ><span class="soshiki-form-dev-marker" aria-hidden="true">解 約</span><span class="sr-only">解約</span></button>
      <button
        type="button"
        class="soshiki-form-idou-btn soshiki-form-idou-btn--henkou"
        data-idou="henkou"
        data-row="{{ row }}"
        aria-pressed="false"
        aria-label="{{ row }}行目・変更"
      ><span class="soshiki-form-dev-marker" aria-hidden="true">変 更</span><span class="sr-only">変更</span></button>
    </div>

    <label class="sr-only" for="member-{{ row }}-union-member-code">{{ row }}行目・組合員コード（6桁）</label>
    <input
      type="text"
      id="member-{{ row }}-union-member-code"
      name="member-{{ row }}-union-member-code"
      class="soshiki-form-field soshiki-form-member-field soshiki-form-member-union-member-code"
      data-access-field="UnionMemberCode"
      data-halfwidth-numeric
      data-max-digits="6"
      data-row="{{ row }}"
      inputmode="numeric"
      autocomplete="off"
      maxlength="6"
      aria-label="{{ row }}行目・組合員コード（6桁）"
    >

    <label class="sr-only" for="member-{{ row }}-family-name-kana">{{ row }}行目・カナ姓</label>
    <input
      type="text"
      id="member-{{ row }}-family-name-kana"
      name="member-{{ row }}-family-name-kana"
      class="soshiki-form-member-box soshiki-form-member-kana-sei{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
      data-access-field="FamilyNameKana"
      data-halfwidth-kana
      autocomplete="off"
      {% if row == 1 %}placeholder="ｾｲ"{% endif %}
      aria-label="{{ row }}行目・カナ姓"
    >

    <label class="sr-only" for="member-{{ row }}-given-name-kana">{{ row }}行目・カナ名</label>
    <input
      type="text"
      id="member-{{ row }}-given-name-kana"
      name="member-{{ row }}-given-name-kana"
      class="soshiki-form-member-box soshiki-form-member-kana-mei{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
      data-access-field="GivenNameKana"
      data-halfwidth-kana
      autocomplete="off"
      {% if row == 1 %}placeholder="ﾒｲ"{% endif %}
      aria-label="{{ row }}行目・カナ名"
    >

    <label class="sr-only" for="member-{{ row }}-family-name">{{ row }}行目・漢字姓</label>
    <input
      type="text"
      id="member-{{ row }}-family-name"
      name="member-{{ row }}-family-name"
      class="soshiki-form-member-box soshiki-form-member-kanji-sei{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
      data-access-field="FamilyName"
      autocomplete="off"
      {% if row == 1 %}placeholder="姓"{% endif %}
      aria-label="{{ row }}行目・漢字姓"
    >

    <label class="sr-only" for="member-{{ row }}-given-name">{{ row }}行目・漢字名</label>
    <input
      type="text"
      id="member-{{ row }}-given-name"
      name="member-{{ row }}-given-name"
      class="soshiki-form-member-box soshiki-form-member-kanji-mei{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
      data-access-field="GivenName"
      autocomplete="off"
      {% if row == 1 %}placeholder="名"{% endif %}
      aria-label="{{ row }}行目・漢字名"
    >

    <label class="sr-only" for="member-{{ row }}-birth-year">{{ row }}行目・生年月日・年</label>
    <input
      type="text"
      id="member-{{ row }}-birth-year"
      name="member-{{ row }}-birth-year"
      class="soshiki-form-member-box soshiki-form-member-birth-year"
      data-access-field="BirthDate"
      data-birth-part="year"
      data-halfwidth-numeric
      data-max-digits="4"
      inputmode="numeric"
      autocomplete="off"
      maxlength="4"
      aria-label="{{ row }}行目・生年月日・年（西暦4桁）"
    >

    <label class="sr-only" for="member-{{ row }}-birth-month">{{ row }}行目・生年月日・月</label>
    <input
      type="text"
      id="member-{{ row }}-birth-month"
      name="member-{{ row }}-birth-month"
      class="soshiki-form-member-box soshiki-form-member-birth-month"
      data-birth-part="month"
      data-halfwidth-numeric
      data-max-digits="2"
      data-pad-2
      inputmode="numeric"
      autocomplete="off"
      maxlength="2"
      aria-label="{{ row }}行目・生年月日・月"
    >

    <label class="sr-only" for="member-{{ row }}-birth-day">{{ row }}行目・生年月日・日</label>
    <input
      type="text"
      id="member-{{ row }}-birth-day"
      name="member-{{ row }}-birth-day"
      class="soshiki-form-member-box soshiki-form-member-birth-day"
      data-birth-part="day"
      data-halfwidth-numeric
      data-max-digits="2"
      data-pad-2
      inputmode="numeric"
      autocomplete="off"
      maxlength="2"
      aria-label="{{ row }}行目・生年月日・日"
    >

    <div class="soshiki-form-gender-group" role="radiogroup" aria-label="{{ row }}行目・性別">
      <input type="hidden" id="member-{{ row }}-gender" name="member-{{ row }}-gender" value="" data-access-field="Gender">
      <button
        type="button"
        class="soshiki-form-gender-btn soshiki-form-gender-btn--male"
        data-gender="1"
        data-row="{{ row }}"
        aria-pressed="false"
        aria-label="{{ row }}行目・男"
      ><span class="soshiki-form-dev-marker" aria-hidden="true">男</span><span class="sr-only">男</span></button>
      <button
        type="button"
        class="soshiki-form-gender-btn soshiki-form-gender-btn--female"
        data-gender="2"
        data-row="{{ row }}"
        aria-pressed="false"
        aria-label="{{ row }}行目・女"
      ><span class="soshiki-form-dev-marker" aria-hidden="true">女</span><span class="sr-only">女</span></button>
    </div>

    <div class="soshiki-form-member-zip-address-row">
      <label class="sr-only" for="member-{{ row }}-postal-code">{{ row }}行目・郵便番号</label>
      <div class="soshiki-form-member-zip-wrap">
        <div class="soshiki-form-member-zip-inner soshiki-form-member-box">
          <span class="soshiki-form-member-zip-view" aria-hidden="true"></span>
          <input
            type="text"
            id="member-{{ row }}-postal-code"
            name="member-{{ row }}-postal-code"
            class="soshiki-form-member-zip{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
            data-access-field="PostalCode"
            data-zip-field
            data-zip-lookup
            data-row="{{ row }}"
            inputmode="numeric"
            autocomplete="postal-code"
            maxlength="8"
            {% if row == 1 %}placeholder="郵便番号"{% endif %}
            aria-label="{{ row }}行目・郵便番号（123-4567）"
          >
        </div>
      </div>

      <label class="sr-only" for="member-{{ row }}-prefecture">{{ row }}行目・都道府県</label>
      <input
        type="text"
        id="member-{{ row }}-prefecture"
        name="member-{{ row }}-prefecture"
        class="soshiki-form-member-box soshiki-form-member-prefecture{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
        data-access-field="Prefecture"
        autocomplete="off"
        {% if row == 1 %}placeholder="都道府県"{% endif %}
        aria-label="{{ row }}行目・都道府県"
      >

      <label class="sr-only" for="member-{{ row }}-city">{{ row }}行目・市区町村</label>
      <input
        type="text"
        id="member-{{ row }}-city"
        name="member-{{ row }}-city"
        class="soshiki-form-member-box soshiki-form-member-city{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
        data-access-field="City"
        autocomplete="off"
        {% if row == 1 %}placeholder="行政区"{% endif %}
        aria-label="{{ row }}行目・市区町村"
      >
    </div>

    <div class="soshiki-form-member-town-area-number-row">
      <label class="sr-only" for="member-{{ row }}-town-area">{{ row }}行目・町村域</label>
      <input
        type="text"
        id="member-{{ row }}-town-area"
        name="member-{{ row }}-town-area"
        class="soshiki-form-member-box soshiki-form-member-town-area{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
        data-access-field="TownArea"
        autocomplete="off"
        {% if row == 1 %}placeholder="町村域"{% endif %}
        aria-label="{{ row }}行目・町村域"
      >

      <label class="sr-only" for="member-{{ row }}-area-number">{{ row }}行目・番地</label>
      <input
        type="text"
        id="member-{{ row }}-area-number"
        name="member-{{ row }}-area-number"
        class="soshiki-form-member-box soshiki-form-member-area-number{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
        data-access-field="AreaNumber"
        autocomplete="off"
        {% if row == 1 %}placeholder="丁、番地"{% endif %}
        aria-label="{{ row }}行目・番地"
      >
    </div>

    <label class="sr-only" for="member-{{ row }}-building-name">{{ row }}行目・建物名</label>
    <input
      type="text"
      id="member-{{ row }}-building-name"
      name="member-{{ row }}-building-name"
      class="soshiki-form-member-box soshiki-form-member-building-name{% if row == 1 %} soshiki-form-member-dev-hint{% endif %}"
      data-access-field="BuildingName"
      autocomplete="off"
      {% if row == 1 %}placeholder="建物名"{% endif %}
      aria-label="{{ row }}行目・建物名"
    >
  </div>
  {% endfor %}
</div>
